[benchmark]
lengths = [100, 1000, 10000, 30000, 100000, 250000, 500000, 750000, 1000000]
repetitions = 10
cached_suffix_tokens = 10000
cached_min_target = 30000
max_output_tokens = 32
context_safety_tokens = 256
seed = 20260812
timeout_seconds = 900.0
prompt = "Return exactly one short sentence summarizing the supplied text. Start immediately with the summary."

[paths]
manifest = "data/corpus/manifest.json"
corpus_dir = "data/corpus"
prompt_dir = "data/prompts"
results_dir = "live-results"

[models.openai_sol]
provider = "openai"
model = "gpt-5.6-sol"
context_window = 1050000
max_input_tokens = 922000
max_output = 128000
input_usd_per_mtok = 5.00
cache_read_usd_per_mtok = 0.50
cache_write_usd_per_mtok = 6.25
output_usd_per_mtok = 30.00
long_context_threshold = 272000
long_input_multiplier = 2.0
long_output_multiplier = 1.5

